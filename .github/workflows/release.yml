name: Build & Release Executables

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: PrintSeriesGenerator-Linux
          - os: windows-latest
            asset_name: PrintSeriesGenerator-Windows.exe
          - os: macos-latest
            asset_name: PrintSeriesGenerator-macOS-AppleSilicon.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux system dependencies (Tkinter)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Executable with PyInstaller
        run: python build_exe.py

      - name: Prepare Asset for Upload (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/PrintSeriesGenerator
          mv dist/PrintSeriesGenerator dist/${{ matrix.asset_name }}

      - name: Prepare Asset for Upload (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mv dist/PrintSeriesGenerator.exe dist/${{ matrix.asset_name }}

      - name: Prepare Asset for Upload (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          if [ -d "PrintSeriesGenerator.app" ]; then
            tar -czf ${{ matrix.asset_name }} PrintSeriesGenerator.app
          else
            chmod +x PrintSeriesGenerator
            tar -czf ${{ matrix.asset_name }} PrintSeriesGenerator
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.os }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: Release ${{ github.event.release.tag_name || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
