name: Build and release standalone binaries

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }} binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: PrintSeriesGenerator-Windows.exe
            macos: false
          - os: ubuntu-latest
            asset: PrintSeriesGenerator-Linux
            macos: false
          - os: macos-latest
            asset: PrintSeriesGenerator-macOS-AppleSilicon
            macos: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux Tkinter)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller

      # Locate the application in either layout:
      #   main.py/settings.json
      #   src/main.py/src/settings.json
      # The same directory is added to PyInstaller's import path, so both
      # package layouts (including the relative-import fallback) work.
      - name: Build executable or macOS app
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset }}
          IS_MACOS: ${{ matrix.macos }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          layouts = (
              (root / 'src' / 'main.py', root / 'src' / 'settings.json'),
              (root / 'main.py', root / 'settings.json'),
          )
          for entry, settings in layouts:
              if entry.is_file() and settings.is_file():
                  break
          else:
              raise SystemExit(
                  'Expected main.py and settings.json at the repository root '
                  'or together under src/'
              )

          shutil.rmtree(root / 'build', ignore_errors=True)
          shutil.rmtree(root / 'dist', ignore_errors=True)

          asset = os.environ['ASSET_NAME']
          is_macos = os.environ['IS_MACOS'].lower() == 'true'
          app_name = 'PrintSeriesGenerator' if is_macos else Path(asset).stem
          command = [
              sys.executable, '-m', 'PyInstaller',
              '--noconfirm', '--clean', '--windowed',
              '--name', app_name,
              '--paths', str(entry.parent),
              '--add-data', f'{settings}{os.pathsep}.',
          ]
          command.append('--onedir' if is_macos else '--onefile')
          command.append(str(entry))
          subprocess.run(command, cwd=root, check=True)

          if is_macos:
              app = root / 'dist' / 'PrintSeriesGenerator.app'
              if not app.is_dir():
                  raise SystemExit(f'Missing expected macOS app: {app}')
              archive = root / 'dist' / f'{asset}.tar.gz'
              subprocess.run(
                  ['tar', '-czf', str(archive), '-C', str(root / 'dist'), app.name],
                  check=True,
              )
              expected = archive
          else:
              expected = root / 'dist' / asset
              if sys.platform == 'win32' and expected.suffix.lower() != '.exe':
                  expected = expected.with_suffix('.exe')
              if not expected.is_file():
                  raise SystemExit(f'Missing expected executable: {expected}')
          print(f'Built {expected}')
          PY

      - name: Upload Windows/Linux executable
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload macOS archive
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  release:
    name: Attach binaries to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: >-
            ${{ github.event_name == 'push' && github.ref_name ||
                github.event_name == 'release' && github.event.release.tag_name ||
                format('manual-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
